site_name: ביוגרפיות המחברים
site_url: https://kdroidfilter.github.io/seforim-author-biographies/
repo_url: https://github.com/kdroidFilter/seforim-author-biographies
docs_dir: docs # assembled by build_site.sh from INDEX.md, LICENSES.md and authors/
copyright: הטקסט מופץ ברישיון <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.he">CC BY-SA 4.0</a>

theme:
  name: material
  language: he
  font:
    text: Frank Ruhl Libre
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle: { icon: material/weather-night, name: מצב כהה }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: מצב בהיר }
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - מחברים: index.md
  - רישיון: licenses.md
not_in_nav: /authors/*

hooks:
  - hooks.py

plugins:
  - search:
      separator: '[\s\-־,:!=\[\]()"/]+'

markdown_extensions:
  - tables
  - toc:
      permalink: true
